plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ENABLE_MQTT：编译期开关（gradle.properties 里配，或用 -PENABLE_MQTT=true 覆盖）
def enableMqtt = (project.findProperty('ENABLE_MQTT') ?: 'false').toString().toBoolean()

android {
    namespace 'com.example.annotation'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.annotation"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 只打包 arm64（G20 是 arm64），把 libvlc-all 里其他架构裁掉，APK 180MB -> ~50MB
        ndk {
            abiFilters "arm64-v8a"
        }

        buildConfigField "boolean", "ENABLE_MQTT", "$enableMqtt"
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            // MQTT 实现放独立源码目录 src/main/mqtt，只在 ENABLE_MQTT=true 时编译（不打包不增体积）
            if (enableMqtt) {
                java.srcDir("src/main/mqtt")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // 测试用 debug 签名，正式上线换 release 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.0'
    if (enableMqtt) {
        implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    }
}
